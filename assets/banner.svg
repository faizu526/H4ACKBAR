<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0"   stop-color="#f4ecd8"/>
      <stop offset="0.5" stop-color="#efe4c9"/>
      <stop offset="1"   stop-color="#e8dab8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0"   stop-color="#8b1a1a"/>
      <stop offset="0.5" stop-color="#c0392b"/>
      <stop offset="1"   stop-color="#8b1a1a"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="#d4c69a" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="120" fill="url(#bg)"/>
  <rect width="1200" height="120" fill="url(#grid)"/>

  <!-- left decorative bracket + hex ticker -->
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#7a6a3a" opacity="0.65">
    <text x="20"  y="20">0x27 20 4f 52 20 31 3d 31 2d 2d</text>
    <text x="20"  y="36">SELECT * FROM users WHERE id='</text>
    <text x="20"  y="104">UNION SELECT NULL,NULL,NULL--</text>
    <text x="20"  y="88">/*!50000 OR */ 1=1 -- -</text>
  </g>

  <!-- main title -->
  <g font-family="Impact, 'Arial Black', sans-serif" text-anchor="middle">
    <text x="600" y="70" font-size="58" fill="#2b1a1a" letter-spacing="6">H4ACKBAR</text>
    <text x="600" y="70" font-size="58" fill="url(#accent)" letter-spacing="6" opacity="0.9" filter="url(#glow)">H4ACKBAR</text>
  </g>

  <!-- underline accent -->
  <line x1="380" y1="82" x2="820" y2="82" stroke="url(#accent)" stroke-width="2"/>
  <line x1="450" y1="88" x2="750" y2="88" stroke="#8b1a1a" stroke-width="0.6" opacity="0.6"/>

  <!-- tagline -->
  <text x="600" y="104" text-anchor="middle"
        font-family="JetBrains Mono, Consolas, monospace" font-size="11"
        fill="#5a3a1a" letter-spacing="3">
    S Q L i · W O R K B E N C H   //   c h a i n   ·   d e t e c t   ·   c r a w l
  </text>

  <!-- right decorative brackets -->
  <g font-family="JetBrains Mono, monospace" font-size="12" fill="#8b1a1a" opacity="0.75">
    <text x="1100" y="22">[ SYN ]</text>
    <text x="1100" y="38">[ ACK ]</text>
    <text x="1100" y="102">[ HEX ]</text>
    <text x="1100" y="86">[ 1=1 ]</text>
  </g>

  <!-- corner ticks -->
  <g stroke="#8b1a1a" stroke-width="1.5" fill="none">
    <path d="M6 6 h18 M6 6 v18"/>
    <path d="M1194 6 h-18 M1194 6 v18"/>
    <path d="M6 114 h18 M6 114 v-18"/>
    <path d="M1194 114 h-18 M1194 114 v-18"/>
  </g>
</svg>
