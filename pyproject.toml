[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h4ackbar"
version = "1.1.0"
description = "SQLi payload workbench — desktop, PyQt6, chain-encoder, fingerprint, crawl, 3-signal detector. Authorized testing only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "H4ACKBAR Contributors" }]
keywords = ["security", "sqli", "pentest", "burp", "payloads", "encoder", "ctf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "PyQt6>=6.7,<7",
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "build>=1.2",
]

[project.scripts]
h4ackbar = "h4ackbar.app:main"

[project.urls]
Homepage      = "https://github.com/YOUR_USER/H4ACKBAR"
Repository    = "https://github.com/YOUR_USER/H4ACKBAR"
Issues        = "https://github.com/YOUR_USER/H4ACKBAR/issues"

[tool.setuptools.packages.find]
include = ["h4ackbar*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion   = "8.0"
testpaths    = ["tests"]
addopts      = "-ra -q --strict-markers"
pythonpath   = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "E701", "E702", "E731"]  # E501: long payload strings; E701/E702/E731: compact one-line statements

[tool.coverage.run]
source = ["h4ackbar"]
omit   = ["h4ackbar/app.py"]  # UI layer — smoke-tested manually
